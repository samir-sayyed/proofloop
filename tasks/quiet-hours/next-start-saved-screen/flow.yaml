appId: com.sam.quiethours
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Get Started"
    timeout: 20000
- tapOn: "Get Started"
- extendedWaitUntil:
    visible: "Explore App"
    timeout: 10000
- tapOn: "Explore App"
- extendedWaitUntil:
    visible: "Your 3-day Premium trial"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Manage your sound profiles"
    timeout: 15000
- tapOn: "Add Schedule"
- extendedWaitUntil:
    visible: "Schedule Details"
    timeout: 10000
- tapOn: "Schedule Title"
- inputText: "Smoke"
- hideKeyboard
- tapOn: "Weekdays"
- tapOn: "Next"
# checkpoint: A1 the wizard review step is shown
- extendedWaitUntil:
    visible: "Step 2 of 2"
    timeout: 10000
- tapOn: "Activate"
# checkpoint: A2 the saved screen states the next start as Wed, Nov 18, 9:00 AM
- extendedWaitUntil:
    visible: "Routine saved"
    timeout: 10000
- assertVisible: "Next start: Wed, Nov 18, 9:00 AM.*"
