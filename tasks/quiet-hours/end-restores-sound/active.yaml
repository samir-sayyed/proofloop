# Home status, read without reopening the app (requires Quiet Hours e4ba3eb or later, which refreshes it).
# Never force-stop here: that cancels the pending END alarm under test.
appId: com.sam.quiethours
---
# checkpoint: E1s Home status during the window
- extendedWaitUntil:
    visible: "Active until 5:00 PM"
    timeout: 15000
